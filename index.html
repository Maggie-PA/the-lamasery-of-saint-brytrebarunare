<<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Lamasery of Saint Brytrebarunare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         MAIN MENU
    ========================== -->

    <div id="loading-screen">

        <!-- Golden Hour Light -->
        <div class="light-overlay"></div>

        <!-- Floating Particles -->
        <div class="particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- =========================
             SAINT
        ========================== -->

        <div class="saint-container">

            <img
                src="images/star-halo.png"
                alt=""
                class="halo">

            <img
                src="images/download-removebg-preview.png"
                alt="Saint Brytrebarunare"
                class="saint">

        </div>


        <!-- =========================
             MAIN MENU CONTENT
        ========================== -->

        <div class="menu-content">

            <h1 class="title">
                THE LAMASERY OF
                <br>
                <span>Saint Brytrebarunare</span>
            </h1>

            <p class="subtitle">
                An Infinite City between Antiquity and the Future!
            </p>


            <!-- Menu -->

            <div class="menu">

                <button id="start-button">
                    Start Game
                </button>

                <button id="settings-button">
                    Settings
                </button>

                <button id="credits-button">
                    Credits
                </button>

                <button id="exit-button">
                    Exit
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         MAIN WEBSITE
    ========================== -->

    <main id="main-content">

        <!-- The actual game will be built here later -->

    </main>


    <script src="script.js"></script>

</body>

</html>
