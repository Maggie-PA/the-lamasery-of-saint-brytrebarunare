<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Lamasery of Saint Brytrebarunare</title>

    <link rel="stylesheet" href="style.css?v=20261108-2">
    <link rel="stylesheet" href="scene.css?v=20261108-2">
</head>

<body>

    <div id="loading-screen">

        <div class="light-overlay"></div>

        <div class="particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="saint-container">
            <img src="images/star-halo.png" alt="" class="halo">
            <img src="images/download-removebg-preview.png" alt="Saint Brytrebarunare" class="saint">
        </div>

        <div class="menu-content">
            <h1 class="title">
                THE LAMASERY OF
                <br>
                <span>Saint Brytrebarunare</span>
            </h1>
            <p class="subtitle">An Infinite City between Antiquity and the Future!</p>
            <div class="menu">
                <button id="start-button">Start Game</button>
                <button id="settings-button">Settings</button>
                <button id="credits-button">Credits</button>
                <button id="exit-button">Exit</button>
            </div>
        </div>

    </div>

    <main id="main-content" aria-label="Game">
        <section id="neocity-scene" class="neocity-scene" aria-label="NeoCity — Arrival">
            <div class="city-atmosphere" aria-hidden="true"></div>
            <div class="city-moon" aria-hidden="true"></div>
            <div class="city-skyline" aria-hidden="true">
                <div class="skyline-building building-one"></div>
                <div class="skyline-building building-two"></div>
                <div class="skyline-building building-three"></div>
                <div class="skyline-building building-four"></div>
                <div class="skyline-building building-five"></div>
            </div>
            <div class="city-ground" aria-hidden="true"></div>
            <header class="scene-heading">
                <p class="scene-kicker">THE INFINITE CITY</p>
                <h1>NeoCity <span>— Arrival</span></h1>
            </header>
            <p class="movement-hint">WASD or arrow keys to move</p>
            <div id="player" class="player" role="img" aria-label="Player character">
                <span class="player-glow"></span>
                <span class="player-head"></span>
                <span class="player-body"></span>
            </div>
        </section>
    </main>

    <script src="script.js?v=20261108-2"></script>

</body>

</html>
